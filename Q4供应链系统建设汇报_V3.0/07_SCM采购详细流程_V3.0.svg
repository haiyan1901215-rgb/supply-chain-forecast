<text x="1270" y="627" font-size="26" fill="#078E99" font-weight="500" text-anchor="middle">供货或交期不满足 → 反馈PMC协调计划</text>
<path d="M64 746 L1212 746" fill="none" stroke="#DC8226" stroke-width="3"  />
