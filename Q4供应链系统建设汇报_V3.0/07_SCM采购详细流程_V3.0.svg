<text x="1769" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">订单资料和任务交付</text>
<text x="1543" y="322" font-size="24" fill="#DC8226" font-weight="650" text-anchor="start">04</text>
