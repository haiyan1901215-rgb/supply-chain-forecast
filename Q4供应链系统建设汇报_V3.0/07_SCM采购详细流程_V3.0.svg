<text x="95" y="107" font-size="49" fill="#008DD5" font-weight="650" text-anchor="start">SCM采购｜PR承接至PO执行</text>
<text x="2496" y="94" font-size="25" fill="#6B7F90" font-weight="500" text-anchor="end">2026 Q4 / V3.0</text>
