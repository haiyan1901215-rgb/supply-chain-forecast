<text x="64" y="799" font-size="33" fill="#18384E" font-weight="650" text-anchor="start">PMC与采购的交接</text>
<text x="1324" y="799" font-size="33" fill="#18384E" font-weight="650" text-anchor="start">Q4重点治理</text>
<text x="64" y="864" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">PMC：买什么、买多少、什么时候要</text>
<text x="64" y="926" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">采购：向谁买、如何拆分和合并</text>
<text x="64" y="988" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">SCM：以PR / PO承载审核及执行状态</text>
<text x="64" y="1050" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">需求变化返回计划侧确认，保留关联</text>
<text x="1324" y="864" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">PO整单、SKU和尾数关闭口径</text>
<text x="1324" y="926" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">供应商接单撤销及异常流转</text>
<text x="1324" y="988" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">多PR合并、一PR拆多PO的关系追溯</text>
<text x="1324" y="1050" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">执行状态反馈PMC，减少重复录入</text>
<rect x="64" y="1165" width="2432" height="100" rx="0" fill="#F3F8FB" stroke="none" stroke-width="2" />
<text x="91" y="1228" font-size="30" fill="#DC8226" font-weight="650" text-anchor="start">交接结果</text>
<text x="300" y="1228" font-size="29" fill="#18384E" font-weight="600" text-anchor="start">供应商可执行的PO、交期与任务，并持续返回执行状态</text>
<text x="64" y="1331" font-size="25" fill="#6B7F90" font-weight="400" text-anchor="start">PR生成接口、审核层级和权限在实施设计中细化，业务职责不再整体标为待定。</text>
