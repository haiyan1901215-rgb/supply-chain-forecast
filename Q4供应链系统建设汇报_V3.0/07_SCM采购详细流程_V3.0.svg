<text x="290" y="444" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">成衣需求来自PMC</text>
<text x="290" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">物料需求来自MRP</text>
