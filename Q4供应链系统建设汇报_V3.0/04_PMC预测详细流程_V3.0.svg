<rect x="1050" y="348" width="5" height="172" rx="0" fill="#008DD5" stroke="none" stroke-width="2" />
<text x="1276" y="394" font-size="34" fill="#18384E" font-weight="600" text-anchor="middle">销售确认</text>
<text x="1276" y="444" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">逐日核对最终预测</text>
<text x="1276" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">提交本W周期</text>
<text x="1050" y="322" font-size="24" fill="#008DD5" font-weight="650" text-anchor="start">03</text>
<path d="M1502 434 L1543 434" fill="none" stroke="#008DD5" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<rect x="1543" y="348" width="452" height="172" rx="5" fill="white" stroke="#008DD5" stroke-width="2" />
