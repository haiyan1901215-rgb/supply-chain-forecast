<text x="1769" y="394" font-size="34" fill="#18384E" font-weight="600" text-anchor="middle">PMC审核</text>
<text x="1769" y="444" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">查看差异与调整原因</text>
<text x="1769" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">确认或退回销售修改</text>
<text x="1543" y="322" font-size="24" fill="#008DD5" font-weight="650" text-anchor="start">04</text>
<path d="M1995 434 L2036 434" fill="none" stroke="#008DD5" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<rect x="2036" y="348" width="452" height="172" rx="5" fill="white" stroke="#008DD5" stroke-width="2" />
