<text x="783" y="444" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">系统基准只读</text>
<text x="783" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">人工修正、结构化活动</text>
<text x="557" y="322" font-size="24" fill="#008DD5" font-weight="650" text-anchor="start">02</text>
<path d="M1009 434 L1050 434" fill="none" stroke="#008DD5" stroke-width="3"  marker-end="url(#arrow-blue)"/>
