<text x="95" y="107" font-size="49" fill="#008DD5" font-weight="650" text-anchor="start">PMC预测｜从日级填报到确认版本</text>
<text x="2496" y="94" font-size="25" fill="#6B7F90" font-weight="500" text-anchor="end">2026 Q4 / V3.0</text>
<path d="M64 144 L2496 144" fill="none" stroke="#008DD5" stroke-width="3"  />
<text x="64" y="193" font-size="27" fill="#3C566B" font-weight="400" text-anchor="start">W周管理任务，天是销售填报单位；系统给基准，销售补充业务判断</text>
<text x="2496" y="193" font-size="23" fill="#6B7F90" font-weight="400" text-anchor="end">04 / 模块展开</text>
<text x="64" y="283" font-size="32" fill="#18384E" font-weight="650" text-anchor="start">业务动作</text>
<rect x="64" y="348" width="452" height="172" rx="5" fill="white" stroke="#008DD5" stroke-width="2" />
<rect x="64" y="348" width="5" height="172" rx="0" fill="#008DD5" stroke="none" stroke-width="2" />
<text x="290" y="394" font-size="34" fill="#18384E" font-weight="600" text-anchor="middle">开启预测周期</text>
<text x="290" y="444" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">PMC确定月份、W周与窗口</text>
<text x="290" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">日期引用计划日历</text>
<text x="64" y="322" font-size="24" fill="#008DD5" font-weight="650" text-anchor="start">01</text>
