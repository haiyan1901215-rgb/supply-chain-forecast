<text x="2262" y="394" font-size="34" fill="#18384E" font-weight="600" text-anchor="middle">确认预测版本</text>
<text x="2262" y="444" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">保留来源、原因与版本</text>
<text x="2262" y="483" font-size="27" fill="#3C566B" font-weight="400" text-anchor="middle">作为备货需求输入</text>
<text x="2036" y="322" font-size="24" fill="#008DD5" font-weight="650" text-anchor="start">05</text>
<path d="M1769 520 L1769 634 L783 634 L783 520" fill="none" stroke="#078E99" stroke-width="4"  marker-end="url(#arrow-teal)"/>
<rect x="1087.44" y="602" width="365.12" height="37" rx="0" fill="white" stroke="none" stroke-width="2" />
<text x="1270" y="627" font-size="26" fill="#078E99" font-weight="500" text-anchor="middle">审核退回 → 修改并重新提交</text>
<path d="M64 746 L1212 746" fill="none" stroke="#008DD5" stroke-width="3"  />
<path d="M1324 746 L2496 746" fill="none" stroke="#008DD5" stroke-width="3"  />
<text x="64" y="799" font-size="33" fill="#18384E" font-weight="650" text-anchor="start">三条输入与一个最终结果</text>
<text x="1324" y="799" font-size="33" fill="#18384E" font-weight="650" text-anchor="start">状态与追溯</text>
<text x="64" y="864" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">系统基准：引用数仓 / 预测模型结果</text>
<text x="64" y="926" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">人工修正：未调整时沿用系统基准</text>
<text x="64" y="988" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">活动影响：结构化记录类型、名称与增量</text>
<text x="64" y="1050" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">最终预测 = 选用基准 + 活动增量</text>
<text x="1324" y="864" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">销售提交后只读，退回后恢复修改</text>
<text x="1324" y="926" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">人工修改必须说明原因</text>
<text x="1324" y="988" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">保留原值、调整值、操作人和时间</text>
<text x="1324" y="1050" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">预测版本用于追溯，不新增版本菜单</text>
<rect x="64" y="1165" width="2432" height="100" rx="0" fill="#F3F8FB" stroke="none" stroke-width="2" />
<text x="91" y="1228" font-size="30" fill="#008DD5" font-weight="650" text-anchor="start">交接结果</text>
<text x="300" y="1228" font-size="29" fill="#18384E" font-weight="600" text-anchor="start">确认后的日级预测及周汇总，交给PMC备货计划</text>
<text x="64" y="1331" font-size="25" fill="#6B7F90" font-weight="400" text-anchor="start">退回沿用同一周期与商品任务；不重复创建一轮预测。</text>
<path d="M64 1384 L2496 1384" fill="none" stroke="#D5E1E9" stroke-width="1.3"  />
<text x="64" y="1420" font-size="22" fill="#6B7F90" font-weight="400" text-anchor="start">Q4供应链产品建设方案 · 汇报分层版 · 目标业务蓝图，按P0 / P1推进</text>
<text x="2496" y="1420" font-size="22" fill="#008DD5" font-weight="500" text-anchor="end">04 / 10</text>
