<text x="1324" y="1050" font-size="29" fill="#3C566B" font-weight="400" text-anchor="start">具体QC系统接入节点分阶段联评</text>
<rect x="64" y="1165" width="2432" height="100" rx="0" fill="#F3F8FB" stroke="none" stroke-width="2" />
