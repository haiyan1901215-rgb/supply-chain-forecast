    function expandRow(r){return`<tr class="expand-row"><td colspan="14"><div class="expand-content"><div class="expand-grid"><div class="expand-section"><div class="expand-title">库存与在途</div><div class="kv-list"><div class="kv-line"><span>南沙库存</span><strong>${fmt(r.ns)}</strong></div><div class="kv-line"><span>采购在途</span><strong>${fmt(r.purchaseIn)}</strong></div><div class="kv-line"><span>FBA在库 / 在途</span><strong>${fmt(r.fba)} / ${fmt(r.fbaIn)}</strong></div><div class="kv-line"><span>跟卖在库 / 在途</span><strong>${fmt(r.co)} / ${fmt(r.coIn)}</strong></div></div></div><div class="expand-section"><div class="expand-title">历史销量</div><div class="kv-list"><div class="kv-line"><span>近3日</span><strong>${r.d3}</strong></div><div class="kv-line"><span>近7日</span><strong>${r.d7}</strong></div><div class="kv-line"><span>近15日</span><strong>${r.d15}</strong></div><div class="kv-line"><span>近30日 / 加权</span><strong>${r.d30} / ${r.weighted}</strong></div></div></div><div class="expand-section"><div class="expand-title">AI预测依据</div><div class="kv-list"><div class="kv-line"><span>AI基准</span><strong>${r.base}</strong></div><div class="kv-line"><span>活动增量</span><strong>+${r.activity}</strong></div><div class="kv-line"><span>AI最终</span><strong>${r.ai}</strong></div><div class="kv-line"><span>活动说明</span><strong>${r.activityNote||"—"}</strong></div></div></div><div class="expand-section"><div class="expand-title">预测处理</div><div class="kv-list"><div class="kv-line"><span>销售最终</span><strong>${r.sales}</strong></div><div class="kv-line"><span>调整原因</span><strong>${r.reason||"—"}</strong></div><div class="kv-line"><span>预测状态</span><strong>${r.status}</strong></div><div class="kv-line"><span>数据更新时间</span><strong>2026/09/09 08:00</strong></div></div></div></div></div></td></tr>`}
    function pagination(total){return`<div class="pagination"><span>共 ${total} 条</span><button class="page-num active">1</button><button class="page-num">2</button><button class="page-num">3</button><span>...</span><select class="select"><option>10 条/页</option><option>20 条/页</option><option>50 条/页</option></select></div>`}

    function windowBody(){const w=state.forecastWindow;return`<div class="stepper">${[["1","预测周期"],["2","填报窗口"],["3","确认发布"]].map(([n,l],i)=>`<div class="step ${state.windowStep===i+1?"active":state.windowStep>i+1?"done":""}"><span class="step-number">${n}</span><span>${l}</span></div>${i<2?'<span class="step-line"></span>':""}`).join("")}</div>${state.windowStep===1?`<div class="window-grid"><label class="field"><span class="field-label">预测月份 *</span><select class="select" id="winMonth"><option>2026年09月</option><option>2026年10月</option></select></label><label class="field"><span class="field-label">预测类型</span><select class="select"><option>月度销售预测</option></select></label><label class="field"><span class="field-label">预测对象</span><select class="select"><option>销售运营</option></select></label><label class="field"><span class="field-label">PMC负责人</span><select class="select" id="winOwner"><option>李敏</option><option>周宁</option></select></label><label class="field full"><span class="field-label">预测商品范围</span><input class="input" value="3,286 个商品" disabled></label></div>`:state.windowStep===2?`<div class="window-grid"><label class="field"><span class="field-label">填报开始时间 *</span><input class="input" id="winStart" type="datetime-local" value="${state.forecastWindow.start||"2026-09-09T10:00"}"></label><label class="field"><span class="field-label">填报截止时间 *</span><input class="input" id="winEnd" type="datetime-local" value="${state.forecastWindow.end||"2026-09-11T18:00"}"></label><label class="field"><span class="field-label">时区</span><select class="select"><option>北京时间 GMT+8</option></select></label><div class="field"><span class="field-label">窗口关闭后</span><div class="radio-row"><label class="radio-option"><input type="radio" name="closeRule" value="auto">自动关闭填报</label><label class="radio-option"><input type="radio" name="closeRule" value="pmc" checked>仅允许PMC延长窗口</label></div></div><div class="field full"><div class="notice">销售仅可在填报窗口内编辑并提交预测；窗口关闭后仍可由 PMC 调整截止时间。</div></div></div>`:`<div class="window-summary"><div class="summary-list"><div class="summary-row"><span>预测周期</span><strong>${state.windowDraft?.month||"2026年09月"}</strong></div><div class="summary-row"><span>填报时间</span><strong>${state.windowDraft?.start||"2026-09-09 10:00"} 至 ${state.windowDraft?.end||"2026-09-11 18:00"}</strong></div><div class="summary-row"><span>销售填报对象</span><strong>12人</strong></div><div class="summary-row"><span>预测商品</span><strong>3,286个商品</strong></div><div class="summary-row"><span>AI预测</span><strong>已生成</strong></div><div class="summary-row"><span>数据更新时间</span><strong>2026/09/09 08:00</strong></div></div></div><div class="notice" style="margin-top:12px">确认开启后，销售运营将在规定时间内进入“销售预测”完成填报。开启后可由 PMC 延长填报截止时间。</div>`}`}

    function configBasePanel(){return`<div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">计划基础参数</h2><div class="small muted">维护计划计算所需的基础周期和覆盖参数。</div></div><button class="btn primary" data-action="generic-toast">保存配置</button></div>${genericTable(["参数名称","参数值","单位","适用渠道","适用站点","生效时间","状态"],[["默认计划周期",30,"天","Amazon","US","2026/09/01",status("启用")],["默认备货周期",35,"天","Amazon","US","2026/09/01",status("启用")],["预测提前发起时间","每月月底","规则","全渠道","全站点","2026/09/01",status("启用")]])}</div><div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">计划日历</h2><div class="small muted">计划日历决定每个日期归属的Month和W周期，销售预测任务只引用这里的定义。</div></div></div>${genericTable(["日期","计划月份","W周期"],["2026/10/01|2026年10月|W1","2026/10/02|2026年10月|W1","2026/10/08|2026年10月|W2","2026/10/15|2026年10月|W3","2026/10/22|2026年10月|W4"].map(x=>x.split("|")))}</div>`}

v class="detail-item"><div class="detail-label">商品名称</div><div class="detail-value">${r.name}</div></div><div class="detail-item"><div class="detail-label">国家/站点</div><div class="detail-value">${r.country} / ${r.site}</div></div><div class="detail-item"><div class="detail-label">销售负责人</div><div class="detail-value">${r.owner}</div></div></div>`:`<div class="kv-list"><div class="kv-line"><span>预测周期发起</span><strong>李敏 · 2026/09/28 10:00</strong></div><div class="kv-line"><span>当前W周期</span><strong>${currentWeek().label} ${currentWeek().range}</strong></div><div class="kv-line"><span>当前状态</span><strong>${wf.status}</strong></div></div>`;openDrawer(`销售预测详情 · ${r.sku}`,`<div class="drawer-tabs">${tabs.map(([k,l])=>`<button class="drawer-tab ${state.detailTab===k?"active":""}" data-action="detail-tab" data-value="${k}">${l}</button>`).join("")}</div>${body}`,roleIsPmc()&&(state.forecastWindow.status==="待PMC审核"||state.forecastWindow.status==="销售填报已关闭")?`<button class="btn danger" data-action="return-one" data-id="${r.id}">退回销售修改</button><button class="btn primary" data-action="confirm-one" data-id="${r.id}">确认预测</button>`:`<button class="btn" data-action="close-drawer">关闭</button>`)}
