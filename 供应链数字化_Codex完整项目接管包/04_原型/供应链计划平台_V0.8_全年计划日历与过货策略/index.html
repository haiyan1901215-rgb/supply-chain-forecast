    function strategyForm(){openDrawer("新增过货策略",`<div class="form-grid"><label class="form-item"><span class="form-label required">渠道/店铺</span><select class="select" id="stShop"><option>B店</option><option>Amazon-US</option></select></label><label class="form-item"><span class="form-label required">国家</span><select class="select" id="stCountry"><option>US</option><option>UK</option></select></label><label class="form-item"><span class="form-label required">商品分层标签</span><select class="select" id="stLayer"><option>爆款-备货</option><option>清货</option><option>新品期</option></select></label><label class="form-item"><span class="form-label required">日销条件</span><select class="select" id="stCond"><option>≥3件日销</option><option>&lt;3件日销</option></select></label><label class="form-item"><span class="form-label required">目标过货水位</span><input class="input" id="stLevel" value="35" /></label><label class="form-item"><span class="form-label">单位</span><input class="input" value="天" disabled /></label><label class="form-item"><span class="form-label required">生效时间</span><input class="input" id="stDate" value="2026/09/01" /></label><label class="form-item full"><span class="form-label">备注</span><textarea class="textarea"></textarea></label></div>`,`<button class="btn" data-action="close-drawer">取消</button><button class="btn primary" data-action="save-new-strategy">保存</button>`)}
    function adjustStrategy(id){const r=strategyRules.find(x=>x.id===id)||strategyRules[0];openDrawer("调整过货策略",`<div class="form-grid"><label class="form-item"><span class="form-label">渠道/店铺</span><input class="input" value="${r.shop}" disabled /></label><label class="form-item"><span class="form-label">国家</span><input class="input" value="${r.country}" disabled /></label><label class="form-item"><span class="form-label">商品分层标签</span><input class="input" value="${r.layer}" disabled /></label><label class="form-item"><span class="form-label">日销条件</span><input class="input" value="${r.condition}" disabled /></label><label class="form-item"><span class="form-label">当前目标水位</span><input class="input" value="${r.level}天 / ${r.version}" disabled /></label><label class="form-item"><span class="form-label required">新目标过货水位</span><input class="input" id="newLevel" value="${r.level}" /></label><label class="form-item"><span class="form-label required">新生效时间</span><input class="input" value="2026/10/01" /></label><label class="form-item full"><span class="form-label required">变更原因</span><textarea class="textarea" id="changeReason"></textarea></label></div>`,`<button class="btn" data-action="close-drawer">取消</button><button class="btn primary" data-action="save-adjust-strategy" data-id="${id}">保存新版本</button>`)}
    document.addEventListener("click",e=>{const t=e.target.closest("[data-nav],[data-close-tab],[data-action],[data-nav-group],[data-config-tab],[data-strategy-tab]");if(!t)return;if(t.dataset.navGroup){state.collapsed[t.dataset.navGroup]=!state.collapsed[t.dataset.navGroup];return renderNav()}if(t.dataset.closeTab){state.openTabs=state.openTabs.filter(x=>x!==t.dataset.closeTab);if(state.page===t.dataset.closeTab)state.page=state.openTabs.at(-1)||"forecast";return render()}if(t.dataset.nav)return openPage(t.dataset.nav);if(t.dataset.configTab){state.configTab=t.dataset.configTab;state.page="plan-config";return render()}if(t.dataset.strategyTab){state.strategyTab=t.dataset.strategyTab;return render()}const a=t.dataset.action;if(a==="toggle-sider"){document.querySelector(".sider").classList.toggle("mobile-open");return}if(a==="close-drawer")return closeDrawer();if(a==="close-modal")return closeModal();if(a==="refresh"||a==="export"||a==="generic-search"||a==="generic-reset"||a==="calendar-search"||a==="strategy-search"||a==="strategy-reset"||a==="strategy-import"||a==="save-generic")return showToast("操作已完成");if(a==="forecast-state"){state.forecastState=t.dataset.value;return render()}if(a==="forecast-search"){state.forecastQuery=document.getElementById("forecastSearch")?.value.trim()||"";return render()}if(a==="forecast-reset"){state.forecastQuery="";state.forecastState="全部";return render()}if(a==="calendar-view"){state.calendarView=t.dataset.view;return render()}if(a==="strategy-view"){state.strategyView=t.dataset.view;return render()}if(a==="edit-matrix"){state.editingMatrix=!state.editingMatrix;render();return showToast(state.editingMatrix?"已进入矩阵编辑":"矩阵策略已保存，生成新版本记录")}if(a==="open-forecast-window")return forecastWindowForm();if(a==="preview-forecast-window"){const s=document.getElementById("fwStart")?.value,e2=document.getElementById("fwEnd")?.value;if(!s||!e2)return showToast("请填写开始时间和截止时间");state.forecastWindowDraft={month:document.getElementById("fwMonth").value,start:s,end:e2,owner:document.getElementById("fwOwner").value};return openModal("确认开启填报窗口",`<div class="form-grid"><div>预测月份：<strong>${state.forecastWindowDraft.month}</strong></div><div>PMC负责人：<strong>${state.forecastWindowDraft.owner}</strong></div><div>开始时间：<strong>${state.forecastWindowDraft.start}</strong></div><div>截止时间：<strong>${state.forecastWindowDraft.end}</strong></div></div>`,`<button class="btn" data-action="close-modal">返回</button><button class="btn primary" data-action="confirm-forecast-window">确认开启</button>`)}if(a==="confirm-forecast-window"){state.forecastWindow={...state.forecastWindow,...state.forecastWindowDraft,status:"填报中"};closeModal();closeDrawer();render();return showToast("月度销量预测填报窗口已开启")}if(a==="enter-forecast")return showToast(state.forecastWindow.status==="填报中"?"已进入销量预测填报":"当前填报窗口尚未开启");if(a==="batch-submit")return showToast("已提交所选销售预测，进入PMC审核");if(a==="open-review")return openDrawer("销售预测审核",standardTable(["SKU","AI最终预测","销售最终预测","调整量","异常","操作"],forecastRows.filter(r=>r.status==="待PMC审核").map(r=>[r.sku,r.finalAi,r.salesFinal,r.salesFinal-r.finalAi,status(r.anomaly||"待审核"),`<button class="btn link" data-action="approve-review">审核</button>`])),`<button class="btn danger" data-action="reject-review">批量退回</button><button class="btn primary" data-action="approve-review">批量审核</button>`);if(a==="approve-review"||a==="reject-review")return showToast(a==="approve-review"?"审核通过":"已退回销售修改");if(a==="ai-detail")return openDrawer("AI预测依据",`<div class="form-grid"><div>基础日均销量：<strong>5.2</strong></div><div>趋势修正：<strong>+0.2</strong></div><div>季节修正：<strong>+0.1</strong></div><div>活动增量：<strong>+0.3</strong></div><div>AI最终预测：<strong>5.8</strong></div><div>预测版本：<strong class="mono">FC-20260909-V03</strong></div></div>`,`<button class="btn" data-action="close-drawer">关闭</button>`);if(a==="edit-forecast")return showToast("销售最终预测已进入行内编辑状态");if(a==="forecast-detail"||a==="transfer-detail"||a==="open-feedback")return openDrawer("详情",`<div class="muted">当前对象详情与操作记录。</div>`,`<button class="btn" data-action="close-drawer">关闭</button><button class="btn primary" data-action="save-generic">保存</button>`);if(a==="generate-plan"||a==="recalculate"||a==="generate-transfer")return showToast("计划已计算，结果已更新");if(a==="generate-calendar")return openDrawer("生成计划日历",`<div class="form-grid"><label class="form-item"><span class="form-label required">年份</span><select class="select"><option>2026</option><option>2027</option></select></label><label class="form-item"><span class="form-label required">计划周规则</span><select class="select"><option>年度连续周 W1-W53</option></select></label><label class="form-item full"><span class="form-label">生成范围</span><input class="input" value="2026/01/01 - 2026/12/31，共365天，W1-W53" disabled /></label></div>`,`<button class="btn" data-action="close-drawer">取消</button><button class="btn primary" data-action="confirm-generate-calendar">生成并应用</button>`);if(a==="confirm-generate-calendar"){closeDrawer();return showToast("2026 年全年计划日历已生成，包含 W1-W53")}if(a==="calendar-import")return openModal("导入计划日历",`<label class="form-item"><span class="form-label required">选择日历文件</span><input class="input" type="file" /></label>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="close-modal">导入并校验</button>`);if(a==="edit-calendar")return openDrawer("编辑计划日历",`<div class="form-grid"><label class="form-item"><span class="form-label required">日期</span><input class="input" value="2026/12/31" /></label><label class="form-item"><span class="form-label required">计划月份</span><input class="input" value="December" /></label><label class="form-item"><span class="form-label required">业务计划周</span><select class="select"><option>W53</option><option>W52</option></select></label><label class="form-item"><span class="form-label">状态</span><select class="select"><option>启用</option><option>停用</option></select></label></div>`,`<button class="btn" data-action="close-drawer">取消</button><button class="btn primary" data-action="save-generic">保存</button>`);if(a==="new-strategy")return strategyForm();if(a==="edit-strategy")return strategyForm();if(a==="adjust-strategy")return adjustStrategy(t.dataset.id);if(a==="save-new-strategy"){const same=strategyRules.some(r=>r.shop===document.getElementById("stShop").value&&r.country===document.getElementById("stCountry").value&&r.layer===document.getElementById("stLayer").value&&r.condition===document.getElementById("stCond").value&&r.date===document.getElementById("stDate").value);if(same)return showToast("已存在相同适用范围的过货策略，请修改已有策略或调整适用条件。");closeDrawer();return showToast("新增过货策略已保存")}if(a==="save-adjust-strategy"){if(!document.getElementById("changeReason")?.value.trim())return showToast("请填写变更原因");closeDrawer();return showToast("策略调整已保存为新版本，历史版本已保留")}if(a==="disable-strategy")return openModal("确认停用策略",`<div>停用后，新的计划计算将不再使用该策略。历史计划数据不受影响，是否继续？</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-disable-strategy">停用</button>`);if(a==="confirm-disable-strategy"){closeModal();return showToast("策略已停用")}if(a==="strategy-version")return openDrawer("过货策略版本详情",standardTable(["版本号","旧值","新值","生效时间","变更原因","操作人","操作时间"],strategyVersions.map(r=>[r.v,r.old,r.next,r.date,r.reason,r.user,r.time])),`<button class="btn" data-action="close-drawer">关闭</button>`);if(a==="new-config"||a==="new-time-param"||a==="edit-time-param")return openDrawer("配置维护",`<div class="form-grid"><label class="form-item"><span class="form-label required">名称</span><input class="input" /></label><label class="form-item"><span class="form-label required">参数值</span><input class="input" /></label><label class="form-item full"><span class="form-label">备注</span><textarea class="textarea"></textarea></label></div>`,`<button class="btn" data-action="close-drawer">取消</button><button class="btn primary" data-action="save-generic">保存</button>`)});
    document.addEventListener("click",e=>{const t=e.target.closest("[data-action='calendar-reset']");if(!t)return;state.calendarMonth="全部";state.calendarWeek="全部";render();showToast("计划日历筛选已重置")})
    document.addEventListener("change",e=>{const t=e.target;if(t.id==="roleSelect"){state.role=t.value;showToast("已切换角色")}if(t.dataset.action==="calendar-month"){state.calendarMonth=t.value;render()}if(t.dataset.action==="calendar-week"){state.calendarWeek=t.value;render()}if(t.dataset.menuCheckAll!==undefined){t.closest("table")?.querySelectorAll("[data-menu-check]").forEach(c=>c.checked=t.checked)}})
    drawerMask.addEventListener("click",closeDrawer);modalMask.addEventListener("click",closeModal);document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closeModal()}})
    const pageForecast=document.getElementById("page-forecast"),pagePurchase=document.getElementById("page-purchase"),pageTransfer=document.getElementById("page-transfer"),pageOwnership=document.getElementById("page-ownership"),pagePlanConfig=document.getElementById("page-plan-config");
    render();
  </script>
