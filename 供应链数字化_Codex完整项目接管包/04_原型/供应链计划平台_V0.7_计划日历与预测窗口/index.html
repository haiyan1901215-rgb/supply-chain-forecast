      if (target.dataset.action === "purchase-state") { state.purchaseStatus = target.dataset.state || "全部"; render(); return; }
      if (target.dataset.action === "transfer-state") { state.transferStatus = target.dataset.state || "全部"; render(); return; }
      if (target.dataset.action === "ownership-state") { state.ownershipStatus = target.dataset.state || "全部"; render(); }
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape") { closeDrawer(); closeModal(); } });
    document.getElementById("roleSelect").addEventListener("change", event => { state.role = event.target.value; showToast(`已切换为${event.target.options[event.target.selectedIndex].text}视角`); render(); });
    document.getElementById("drawerMask").addEventListener("click", closeDrawer); document.getElementById("modalMask").addEventListener("click", closeModal);
    document.addEventListener("click", event => { const target = event.target.closest("[data-action='confirm-reject'], [data-action='save-inline-forecast']"); if (!target) return; if (target.dataset.action === "confirm-reject") { const reason = document.getElementById("rejectReason")?.value.trim(); if (!reason) return showToast("请填写退回原因"); state.forecasts.forEach(r=>{if(r.status === "待PMC审核") r.status = "PMC退回";}); closeModal(); render(); showToast("已退回销售修改"); } if (target.dataset.action === "save-inline-forecast") { const reason = document.getElementById("inlineReason")?.value.trim(); if (!reason) return showToast("请填写调整原因"); const row = state.forecasts.find(r=>r.id === target.dataset.id); row.reason = reason; row.salesFinal = Number(target.dataset.value); state.editing = null; closeModal(); render(); showToast("销售最终预测已保存"); } });
    render();
  </script>
</body>
</html>
