    forecastQuery=function(){const w=state.forecastWindow;return`<div class="query-panel"><div class="query-row"><div class="field"><span class="field-label">预测月份</span><select class="select"><option>${w.month}</option><option>2026年11月</option></select></div><div class="field"><span class="field-label">W周期</span><select class="select"><option>${currentWeek()?.label||"W1"}</option>${(w.weeks||[]).slice(1).map(x=>`<option>${x.label}</option>`).join("")}</select></div><div class="field"><span class="field-label">国家</span><select class="select"><option>全部</option><option>US</option><option>UK</option><option>DE</option></select></div><div class="field"><span class="field-label">站点</span><select class="select"><option>全部</option><option>Amazon-US</option><option>Amazon-UK</option></select></div><div class="field"><span class="field-label">销售负责人</span><select class="select"><option>全部</option><option>李敏</option><option>周宁</option><option>陈洁</option></select></div></div><div class="query-row"><div class="field wide"><span class="field-label">父体ASIN / 子体ASIN / SKU</span><input class="input" id="forecastSearch" value="${esc(state.query)}" placeholder="请输入商品身份或SKU"></div><div class="field"><span class="field-label">采购标签</span><select class="select"><option>全部</option><option>停采</option><option>正常采购</option></select></div><div class="field"><span class="field-label">SKC分层标签</span><select class="select"><option>全部</option><option>成熟款</option><option>爆款-备货</option><option>清货</option></select></div><div class="field"><span class="field-label">过货标签</span><select class="select"><option>全部</option><option>正常过货</option><option>低优先级</option></select></div><div class="field"><span class="field-label">预测状态</span><select class="select"><option>全部</option><option>待提交</option><option>已提交</option><option>待PMC审核</option><option>待销售修改</option></select></div><button class="btn primary" data-action="forecast-search">搜索</button><button class="btn" data-action="forecast-reset">重置</button><button class="btn" data-action="toggle-more">更多筛选</button></div><div class="more-filters ${state.more?"open":""}" id="moreFilters"><div class="field"><span class="field-label">SKP</span><input class="input" placeholder="SKP"></div><div class="field"><span class="field-label">首版SKU</span><input class="input" placeholder="首版SKU"></div><div class="field"><span class="field-label">销售SKU</span><input class="input" placeholder="销售SKU"></div><div class="field"><span class="field-label">FNSKU-销售</span><input class="input" placeholder="FNSKU-销售"></div><div class="field"><span class="field-label">开卖时间</span><input class="input" placeholder="YYYY/MM/DD"></div></div></div>`}
    function configTabs(){const defs=[["base","计划基础参数"],["cycle","销售预测周期"],["supplier","供应商参数"],["logistics","物流参数"],["moq","MOQ规则"]];return`<div class="state-tabs">${defs.map(([k,l])=>`<button class="state-tab ${state.configTab===k?"active":""}" data-action="config-tab" data-value="${k}">${l}</button>`).join("")}</div>`}
    function configTaskActions(){const w=state.forecastWindow;if(!roleIsPmc())return"";if(w.status==="待发起")return`<button class="btn primary" data-action="open-window">发起本期预测</button>`;if(w.status==="销售填报中")return`<button class="btn" data-action="view-window">查看任务</button><button class="btn" data-action="adjust-window">调整截止时间</button><button class="btn danger" data-action="close-window">关闭销售填报</button>`;if(w.status==="销售填报已关闭")return`<button class="btn primary" data-action="enter-review">进入审核</button><button class="btn" data-action="view-window">查看任务</button><button class="btn" data-action="adjust-window">调整截止时间</button>`;if(w.status==="待PMC审核")return`<button class="btn primary" data-action="enter-review">进入审核</button><button class="btn" data-action="view-window">查看任务</button>`;return`<button class="btn" data-action="view-window">查看任务</button>`}
    function configCyclePanel(){const w=state.forecastWindow;return`<div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">周期规则</h2><div class="small muted">定义系统如何根据计划日历生成本轮W周期，不在此页面手工维护日期。</div></div></div><div class="detail-grid"><div class="detail-item"><div class="detail-label">计划周期</div><div class="detail-value">月度</div></div><div class="detail-item"><div class="detail-label">W周期定义</div><div class="detail-value">按计划日历</div></div><div class="detail-item"><div class="detail-label">默认需维护W周期数</div><div class="detail-value">4个</div></div><div class="detail-item"><div class="detail-label">预测提前发起时间</div><div class="detail-value">每月月底</div></div></div><div class="notice" style="margin-top:12px">W周期日期由“计划配置 → 计划日历”生成。当前示例：2026年10月 W1-W4。</div></div><div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">本期预测任务</h2><div class="small muted">PMC在每月月底发起下一周期销售预测，销售运营在销售预测页面按W周期填报。</div></div><div class="page-actions">${configTaskActions()}</div></div><div class="cycle-content"><div class="cycle-main"><span class="cycle-title">${w.month}销售预测</span>${status(w.status)}<span class="cycle-meta">预计填报对象：销售运营</span><span class="cycle-meta">预测商品：${fmt(w.total)}个</span><span class="cycle-meta">填报进度：${w.progress}%</span></div><div class="week-list"><span class="week-pill"><strong>需维护</strong>${w.weekCount}个W周期</span>${w.start&&w.end?`<span class="week-pill"><strong>填报窗口</strong>${w.start} - ${w.end}</span>`:`<span class="week-pill"><strong>填报窗口</strong>未开启</span>`}</div>${w.status==="待发起"?weekListHtml():weekProgressHtml()}</div></div>`}
    function configBasePanel(){return`<div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">计划基础参数</h2><div class="small muted">维护计划计算所需的基础周期和覆盖参数。</div></div><button class="btn primary" data-action="generic-toast">保存配置</button></div>${genericTable(["参数名称","参数值","单位","适用渠道","适用站点","生效时间","状态"],[["默认计划周期",30,"天","Amazon","US","2026/09/01",status("启用")],["默认备货周期",35,"天","Amazon","US","2026/09/01",status("启用")],["预测提前发起时间","每月月底","规则","全渠道","全站点","2026/09/01",status("启用")]])}</div><div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">计划日历</h2><div class="small muted">计划日历决定每个日期归属的Month和W周期，销售预测任务只引用这里的定义。</div></div></div>${genericTable(["日期","计划月份","W周期"],["2026/10/01|2026年10月|W1","2026/10/02|2026年10月|W1","2026/10/08|2026年10月|W2","2026/10/15|2026年10月|W3","2026/10/22|2026年10月|W4"].map(x=>x.split("|")))}</div>`}
    function configGenericPanel(title,heads,data){return`<div class="query-panel"><div class="page-header" style="margin-bottom:10px"><div><h2 class="drawer-section-title" style="margin:0;border:0">${title}</h2><div class="small muted">当前为配置示例，具体适用范围和生效规则保留业务确认。</div></div><button class="btn primary" data-action="generic-toast">新增配置</button></div>${genericTable(heads,data)}</div>`}
    renderConfig=function(){syncWindowStatus();const body=state.configTab==="cycle"?configCyclePanel():state.configTab==="base"?configBasePanel():state.configTab==="supplier"?configGenericPanel("供应商参数",["供应商","SKU/SKC","生产周期","MOQ","有效期","状态"],[["供应商A","SKC-00618","35天",500,"2026/09/01",status("启用")],["供应商B","SKC-00642","28天",300,"2026/09/01",status("启用")]]):state.configTab==="logistics"?configGenericPanel("物流参数",["运输方式","起运地","目的地","运输时效","入库缓冲","状态"],[["STA快船","南沙","US FBA","35天","3天",status("启用")],["STA普空","南沙","US FBA","20天","5天",status("启用")]]):configGenericPanel("MOQ规则",["规则名称","供应商","SKC","MOQ","起订单位","优先级","状态"],[["B店常规备货","供应商A","SKC-00618",500,"件",1,status("启用")],["低销合并备货","供应商B","SKC-00642",300,"件",2,status("启用")]]);pageConfig.innerHTML=`${pageHeader("计划参数")}${configTabs()}${body}`}
    renderNav=function(){const items=state.role==="sales"?navItems.filter(x=>x[0]==="forecast"):navItems;nav.innerHTML=items.map(([key,label,icon])=>`<button class="nav-button ${state.page===key?"active":""}" data-nav="${key}"><span class="nav-label"><span class="nav-icon">${icon}</span>${label}</span></button>`).join("")}
    render=function(){syncWindowStatus();if(state.role==="sales"&&state.page!=="forecast")state.page="forecast";renderNav();breadcrumb.textContent=state.page==="config"?`供应链计划 / 计划配置 / 计划参数${state.configTab==="cycle"?" / 销售预测周期":""}`:`供应链计划 / ${pageName(state.page)}`;$$(".page").forEach(p=>p.classList.toggle("active",p.id===`page-${state.page}`));({forecast:renderForecast,purchase:renderPurchase,transfer:renderTransfer,config:renderConfig}[state.page]||renderForecast)()}
    closeWindow=function(){const w=state.forecastWindow;openModal("关闭销售填报",`<div class="detail-grid"><div class="detail-item"><div class="detail-label">预测周期</div><div class="detail-value">${w.month}</div></div><div class="detail-item"><div class="detail-label">需维护W周期</div><div class="detail-value">${w.weekCount}个</div></div><div class="detail-item"><div class="detail-label">当前填报进度</div><div class="detail-value">${w.progress}%</div></div><div class="detail-item"><div class="detail-label">已提交</div><div class="detail-value">${fmt(w.submitted)}</div></div><div class="detail-item"><div class="detail-label">未提交</div><div class="detail-value">${fmt(w.total-w.submitted)}</div></div></div><div class="notice warning" style="margin-top:12px">关闭后，销售运营将无法继续修改或提交本轮销量预测。未提交的数据将保留当前状态。</div>`,`<button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-close-window">确认关闭</button>`)}
    detailDrawer=function(r){const tabs=[["result","预测结果"],["history","销售历史"],["inventory","库存与在途"],["product","商品信息"],["logs","操作记录"]];const matrix=`<table class="forecast-matrix"><thead><tr><th></th>${(state.forecastWindow.weeks||[]).map(w=>`<th>${w.label}<div class="product-sub">${w.range}</div></th>`).join("")}</tr></thead><tbody><tr><td>AI预测</td>${r.weekForecasts.map(w=>`<td>${w.ai}</td>`).join("")}</tr><tr><td>销售预测</td>${r.weekForecasts.map(w=>`<td>${w.sales}</td>`).join("")}</tr><tr><td>调整量</td>${r.weekForecasts.map(w=>`<td>${w.sales-w.ai>0?"+":""}${w.sales-w.ai}</td>`).join("")}</tr></tbody></table>`;const wf=currentForecast(r);const body=state.detailTab==="result"?`<div class="drawer-section"><div class="drawer-section-title">多W周期预测</div>${matrix}</div><div class="drawer-section"><div class="drawer-section-title">${currentWeek().label} 预测结果</div><div class="formula-row"><span>AI基准预测</span><strong>${wf.base}</strong></div><div class="formula-row"><span>活动增量</span><strong>+${wf.activity}</strong></div><div class="formula-row total"><span>AI最终预测</span><strong>${wf.ai}</strong></div><div class="formula-row"><span>销售最终预测</span><strong>${wf.sales}</strong></div><div class="formula-row"><span>销售调整</span><strong>${wf.sales-wf.ai>0?"+":""}${wf.sales-wf.ai}</strong></div></div><div class="drawer-section"><div class="drawer-section-title">调整原因</div><div>${wf.reason||"未填写"}</div></div><div class="drawer-section"><div class="drawer-section-title">预测状态</div><div>${status(wf.status)}</div></div>`:state.detailTab==="history"?historyBody(r):state.detailTab==="inventory"?inventoryBody(r):state.detailTab==="product"?`<div class="detail-grid"><div class="detail-item"><div class="detail-label">SKU</div><div class="detail-value mono">${r.sku}</div></div><div class="detail-item"><div class="detail-label">SKC</div><div class="detail-value mono">${r.skc}</div></div><div class="detail-item"><div class="detail-label">子ASIN</div><div class="detail-value mono">${r.child}</div></div><div class="detail-item"><div class="detail-label">商品名称</div><div class="detail-value">${r.name}</div></div><div class="detail-item"><div class="detail-label">国家/站点</div><div class="detail-value">${r.country} / ${r.site}</div></div><div class="detail-item"><div class="detail-label">销售负责人</div><div class="detail-value">${r.owner}</div></div></div>`:`<div class="kv-list"><div class="kv-line"><span>预测周期发起</span><strong>李敏 · 2026/09/28 10:00</strong></div><div class="kv-line"><span>当前W周期</span><strong>${currentWeek().label} ${currentWeek().range}</strong></div><div class="kv-line"><span>当前状态</span><strong>${wf.status}</strong></div></div>`;openDrawer(`销售预测详情 · ${r.sku}`,`<div class="drawer-tabs">${tabs.map(([k,l])=>`<button class="drawer-tab ${state.detailTab===k?"active":""}" data-action="detail-tab" data-value="${k}">${l}</button>`).join("")}</div>${body}`,roleIsPmc()&&(state.forecastWindow.status==="待PMC审核"||state.forecastWindow.status==="销售填报已关闭")?`<button class="btn danger" data-action="return-one" data-id="${r.id}">退回销售修改</button><button class="btn primary" data-action="confirm-one" data-id="${r.id}">确认预测</button>`:`<button class="btn" data-action="close-drawer">关闭</button>`)}
    historyBody=function(r){const months=Object.entries(r.monthlySales||{});return`<div class="drawer-section"><div class="drawer-section-title">历史日均销量</div><div class="detail-grid"><div class="detail-item"><div class="detail-label">近3日日均</div><div class="detail-value">${r.d3}</div></div><div class="detail-item"><div class="detail-label">近7日日均</div><div class="detail-value">${r.d7}</div></div><div class="detail-item"><div class="detail-label">近15日日均</div><div class="detail-value">${r.d15}</div></div><div class="detail-item"><div class="detail-label">近20日日均</div><div class="detail-value">${r.d20}</div></div><div class="detail-item"><div class="detail-label">近30日日均</div><div class="detail-value">${r.d30}</div></div><div class="detail-item"><div class="detail-label">加权日均</div><div class="detail-value">${r.weighted}</div></div><div class="detail-item"><div class="detail-label">单店SKC合计销</div><div class="detail-value">${r.skcTotalSales}</div></div><div class="detail-item"><div class="detail-label">单店SKP合计销</div><div class="detail-value">${r.skpTotalSales}</div></div></div></div><div class="drawer-section"><div class="drawer-section-title">月度销量</div><div class="table-box"><table class="forecast-table"><thead><tr><th>月份</th>${months.map(([m])=>`<th>${m}</th>`).join("")}</tr></thead><tbody><tr><td>销量</td>${months.map(([,v])=>`<td class="num">${v}</td>`).join("")}</tr></tbody></table></div></div>`}
    inventoryBody=function(r){return`<div class="detail-grid"><div class="detail-item"><div class="detail-label">FBA在库数量</div><div class="detail-value">${fmt(r.fba)}</div></div><div class="detail-item"><div class="detail-label">FBA在途数量</div><div class="detail-value">${fmt(r.fbaIn)}</div></div><div class="detail-item"><div class="detail-label">FBA库途合计</div><div class="detail-value">${fmt(r.fbaTotal)}</div></div><div class="detail-item"><div class="detail-label">在库DOI</div><div class="detail-value">${r.doi}天</div></div><div class="detail-item"><div class="detail-label">在途DOI</div><div class="detail-value">${r.transitDoi}天</div></div><div class="detail-item"><div class="detail-label">总库存DOI</div><div class="detail-value">${r.totalDoi}天</div></div><div class="detail-item"><div class="detail-label">南沙库存</div><div class="detail-value">${fmt(r.ns)}</div></div><div class="detail-item"><div class="detail-label">采购在途</div><div class="detail-value">${fmt(r.purchaseIn)}</div></div></div><div class="small muted" style="margin-top:12px">数据更新时间：2026/09/09 08:00</div>`}

    detailDrawer=function(r){if(state.detailTab!=="product")return legacyDetailDrawer(r);const fields=[["父体ASIN",r.parentAsin],["子体ASIN",r.child],["SKP",r.skp],["SKC",r.skc],["首版SKU",r.firstSku],["标准SKU",r.standardSku],["销售SKU",r.salesSku],["FNSKU-销售",r.salesFnsku],["跟卖SKU",r.coSku],["FNSKU-跟卖",r.coFnsku],["开卖时间",r.launchDate],["国家/站点",`${r.country} / ${r.site}`],["销售负责人",r.owner]];openDrawer(`商品信息 · ${r.sku}`,`<div class="drawer-tabs">${[["result","预测结果"],["history","销售历史"],["inventory","库存与在途"],["product","商品信息"],["logs","操作记录"]].map(([k,l])=>`<button class="drawer-tab ${state.detailTab===k?"active":""}" data-action="detail-tab" data-value="${k}">${l}</button>`).join("")}</div><div class="detail-grid">${fields.map(([label,value])=>`<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`).join("")}</div>`,`<button class="btn" data-action="close-drawer">关闭</button>`)}
    const legacyPopoverFor=popoverFor;

      }
      function v11WeekSummary(r){

        const final=v11Round(d.reduce((s,x)=>s+x.final,0));

 class="field"><span class="field-label">DOI异常</span><select class="select"><option>全部</option><option>有异常</option><option>无异常</option></select></label><label class="field"><span class="field-label">活动状态</span><select class="select"><option>全部</option><option>有活动</option><option>无活动</option></select></label></div></div>`

        if(a==="v11-batch-confirm"){if(!state.selected.length)return toast("请先选择待审核商品");state.selected.forEach(id=>{const r=rows.find(x=>x.id===id);if(r&&v11Current(r).status==="已提交"){r.v11Status="已确认";v11SetLegacy(r,"已确认")}});state.selected=[];v11UpdateProgress();render();return toast("所选W周期预测已确认")}

        if(a==="v11-confirm-return"){const reason=$("#v11ReturnReason")?.value.trim();if(!reason)return toast("请填写退回原因");const ids=(t.dataset.ids||"").split(",");ids.forEach(id=>{const r=rows.find(x=>x.id===id);if(r){r.v11Status="待销售修改";v11Current(r).status="待销售修改";v11Current(r).returnReason=reason;v11SetLegacy(r,"待销售修改")}});state.selected=[];closeModal();v11UpdateProgress();render();return toast("已退回销售修改")}
      },true);
      document.addEventListener("input",function(e){
        const t=e.target.closest("[data-v11-field]");if(!t||!state.v11DailyOpen)return;
        const r=v11CurrentDrawerRow();if(!r)return;const d=v11Current(r).days[Number(t.dataset.v11Index)],value=Number(t.value);
        if(t.dataset.v11Field==="manual"){d.manual=Number.isFinite(value)?v11Round(value):0;d.manualEdited=Math.abs(d.manual-d.system)>0.001;if(!d.manualEdited)d.manualReason=""}
        if(t.dataset.v11Field==="activity"){d.activity=Number.isFinite(value)?v11Round(value):0;if(d.activity>0&&!d.activityMeta)d.activityMeta={type:"",name:"",note:""}}
        v11UpdateDailyDOM(r)
      },true);
      document.addEventListener("change",function(e){
        const t=e.target;if(t.dataset.v11Check){if(t.checked)state.selected=[...new Set([...state.selected,t.dataset.v11Check])];else state.selected=state.selected.filter(x=>x!==t.dataset.v11Check);return}
      },true);
      v11EnsureAll();v11UpdateProgress();render();
    })();
  </script>
</body>
</html>
