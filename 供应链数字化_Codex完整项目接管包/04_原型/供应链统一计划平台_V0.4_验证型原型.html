<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>供应链统一计划平台 V0.4 验证型原型</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d9e0ea;
      --text: #17212b;
      --muted: #667085;
      --blue: #1677ff;
      --blue-soft: #eaf3ff;
      --green: #0f8f5f;
      --green-soft: #eaf8f1;
      --orange: #d46b08;
      --orange-soft: #fff4e5;
      --red: #cf1322;
      --red-soft: #fff1f0;
      --purple: #722ed1;
      --purple-soft: #f3eefe;
      --shadow: 0 12px 30px rgba(18, 38, 63, .12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    button, input, select, textarea { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 232px 1fr; }
    .sidebar { background: #111827; color: #e5e7eb; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .brand { height: 40px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--blue); display: grid; place-items: center; color: #fff; }
    .nav { display: grid; gap: 4px; }
    .nav button { width: 100%; border: 0; background: transparent; color: #cbd5e1; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
    .nav button span { color: #94a3b8; font-size: 12px; }
    .nav button.active, .nav button:hover { background: #1f2937; color: #fff; }
    .note { color: #9ca3af; font-size: 12px; padding: 8px 10px; border: 1px solid #374151; border-radius: 6px; }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 20; height: 58px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 8px 18px; gap: 12px; }
    .breadcrumb { font-size: 12px; color: var(--muted); }
    .scope { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .field { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .select, .input, .textarea { border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--text); padding: 6px 8px; outline: 0; }
    .input { min-width: 120px; }
    .textarea { min-height: 84px; width: 100%; resize: vertical; }
    .segmented { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .segmented button { border: 0; background: transparent; padding: 6px 12px; border-radius: 5px; cursor: pointer; color: var(--muted); }
    .segmented button.active { background: var(--blue); color: #fff; }
    .content { padding: 16px 18px 28px; min-width: 0; }
    .page { display: none; }
    .page.active { display: block; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.text { border-color: transparent; background: transparent; color: var(--blue); padding-left: 4px; padding-right: 4px; }
    .btn.danger { color: var(--red); border-color: #ffd1d1; background: #fff7f7; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .grid { display: grid; gap: 12px; }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card, .band { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
    .card { padding: 14px; }
    .band { margin-bottom: 14px; overflow: hidden; }
    .band-header { min-height: 42px; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .band-title { font-weight: 700; }
    .band-body { padding: 12px; }
    .metric-label { color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
    .metric-value { font-size: 24px; font-weight: 750; margin-top: 8px; }
    .metric-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .tag { display: inline-flex; align-items: center; border-radius: 4px; padding: 1px 6px; font-size: 12px; border: 1px solid transparent; white-space: nowrap; }
    .tag.blue { color: #0958d9; background: var(--blue-soft); border-color: #b7d5ff; }
    .tag.green { color: var(--green); background: var(--green-soft); border-color: #b7ebc6; }
    .tag.orange { color: var(--orange); background: var(--orange-soft); border-color: #ffd591; }
    .tag.red { color: var(--red); background: var(--red-soft); border-color: #ffa39e; }
    .tag.purple { color: var(--purple); background: var(--purple-soft); border-color: #d3adf7; }
    .assumption { display: inline-flex; color: var(--orange); background: var(--orange-soft); border: 1px solid #ffd591; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .summary-item { padding: 8px; border: 1px solid #edf1f7; border-radius: 6px; background: #fbfcfe; min-width: 0; }
    .summary-label { color: var(--muted); font-size: 12px; }
    .summary-value { margin-top: 3px; font-weight: 650; overflow-wrap: anywhere; }
    .table-wrap { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { border-bottom: 1px solid #edf1f7; padding: 8px 10px; vertical-align: top; text-align: left; }
    th { background: #f8fafc; color: #344054; font-weight: 700; white-space: nowrap; }
    tr:hover td { background: #fbfdff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { font-size: 12px; }
    .muted { color: var(--muted); }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
    .tab.active { background: var(--blue-soft); border-color: #91caff; color: #0958d9; }
    .chain { display: grid; gap: 10px; }
    .chain-step { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
    .chain-title { display: flex; justify-content: space-between; gap: 8px; padding: 9px 10px; background: #f8fafc; border-bottom: 1px solid var(--line); font-weight: 700; }
    .chain-body { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 10px; }
    .kv { border: 1px solid #edf1f7; border-radius: 6px; padding: 7px; min-width: 0; }
    .kv-k { color: var(--muted); font-size: 12px; }
    .kv-v { margin-top: 3px; font-weight: 650; overflow-wrap: anywhere; }
    .drawer-mask, .modal-mask { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 50; }
    .drawer-mask.open, .modal-mask.open { display: block; }
    .drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(760px, 92vw); background: #fff; z-index: 60; transform: translateX(100%); transition: transform .2s ease; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .drawer.open { transform: translateX(0); }
    .drawer-header, .drawer-footer { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .drawer-footer { border-top: 1px solid var(--line); border-bottom: 0; justify-content: flex-end; }
    .drawer-title { font-weight: 750; font-size: 16px; }
    .drawer-body { padding: 14px; overflow: auto; }
    .modal { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, 92vw); background: #fff; border-radius: 8px; z-index: 70; box-shadow: var(--shadow); }
    .modal.open { display: block; }
    .modal-header, .modal-footer { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .modal-footer { border-top: 1px solid var(--line); border-bottom: 0; justify-content: flex-end; gap: 8px; }
    .modal-body { padding: 14px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .form-item { display: grid; gap: 4px; }
    .form-item.full { grid-column: 1 / -1; }
    .alert { padding: 9px 10px; border-radius: 6px; border: 1px solid #ffd591; background: var(--orange-soft); color: #7a4b00; }
    .impact-list { display: grid; gap: 8px; }
    .toast { position: fixed; right: 18px; bottom: 18px; background: #111827; color: #fff; padding: 9px 12px; border-radius: 6px; opacity: 0; transform: translateY(10px); transition: .2s ease; z-index: 100; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { position: static; height: auto; align-items: flex-start; flex-direction: column; }
      .cols-4, .cols-3, .cols-2, .summary, .chain-body, .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div><div>供应链统一计划平台</div></div>
      <nav class="nav" id="nav"></nav>
      <div class="note">V0.4：把参数解释为“来源、Owner、业务目的、计算影响、变更影响”，用于业务走查纠偏；备货周期不默认等于需求覆盖周期；安全水位不默认解释为传统安全库存件数；不创建预测算法、库存主数据或正式PR模块。</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <div class="breadcrumb" id="breadcrumb">工作台</div>
          <div class="scope" id="scopeText"></div>
        </div>
        <div class="top-actions">
          <label class="field">角色
            <select class="select" id="roleSelect">
              <option value="pmc">PMC</option>
              <option value="ops">运营</option>
              <option value="brand">品牌项目负责人</option>
              <option value="buyer">采购</option>
              <option value="manager">管理者</option>
            </select>
          </label>
          <div class="segmented" id="sceneSwitch">
            <button data-scene="mature" class="active" type="button">成熟老品</button>
            <button data-scene="multi" type="button">多平台</button>
            <button data-scene="new" type="button">新品</button>
          </div>
        </div>
      </header>
      <div class="content">
        <section class="page active" id="page-dashboard"></section>
        <section class="page" id="page-demand"></section>
        <section class="page" id="page-plan"></section>
        <section class="page" id="page-result"></section>
        <section class="page" id="page-channelParams"></section>
        <section class="page" id="page-channelStrategy"></section>
        <section class="page" id="page-supplyConstraint"></section>
        <section class="page" id="page-stockCalendar"></section>
        <section class="page" id="page-specialRules"></section>
        <section class="page" id="page-scheme"></section>
      </div>
    </main>
  </div>

  <div class="drawer-mask" id="drawerMask"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header"><div class="drawer-title" id="drawerTitle"></div><button class="btn" id="drawerClose" type="button">关闭</button></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer">
      <button class="btn" id="impactFromDrawer" type="button">查看变更影响</button>
      <button class="btn primary" id="correctFromDrawer" type="button">提出纠偏</button>
    </div>
  </aside>

  <div class="modal-mask" id="modalMask"></div>
  <section class="modal" id="correctionModal">
    <div class="modal-header"><strong>业务纠偏记录</strong><button class="btn" id="modalClose" type="button">关闭</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-item full"><label>原方案/原参数</label><textarea class="textarea" id="correctionOrigin" readonly></textarea></div>
        <div class="form-item full"><label>业务反馈</label><textarea class="textarea" id="correctionFeedback">请直接写：当前设计哪里不对，应修改为...</textarea></div>
        <div class="form-item"><label>反馈人</label><input class="input" id="correctionUser" value="业务负责人" /></div>
        <div class="form-item"><label>处理状态</label><select class="select"><option>待产品确认</option><option>已采纳</option><option>需再次访谈</option></select></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn" id="modalCancel" type="button">取消</button><button class="btn primary" id="modalSubmit" type="button">记录纠偏</button></div>
  </section>
  <div class="toast" id="toast"></div>

  <script>
    const navs = [
      ["dashboard", "工作台", "任务"],
      ["demand", "需求计划", "预测+修正"],
      ["plan", "计划管理", "创建"],
      ["result", "计划结果", "为什么采购"],
      ["channelParams", "渠道计划参数", "时效/水位"],
      ["channelStrategy", "渠道采购策略", "准入"],
      ["supplyConstraint", "商品供应约束", "MOQ"],
      ["stockCalendar", "备货日历", "节点"],
      ["specialRules", "特殊计划规则", "例外"],
      ["scheme", "规则方案", "组合层"]
    ];
    const roles = { pmc: "PMC", ops: "运营", brand: "品牌项目负责人", buyer: "采购", manager: "管理者" };
    const scenes = {
      mature: { label: "成熟老品", owner: "PMC", scheme: "成熟老品-非首单补货方案 V1", scope: { pmc: "成熟老品/负责SKU", ops: "授权查看渠道需求", brand: "负责品牌摘要", buyer: "负责供应商SKU", manager: "全部成熟老品" }, canCreate: ["pmc", "manager"] },
      multi: { label: "多平台", owner: "运营", scheme: "多平台-常规备货方案 V1", scope: { pmc: "授权查看摘要", ops: "负责平台/国家", brand: "负责品牌多平台摘要", buyer: "负责供应商SKU", manager: "全部多平台" }, canCreate: ["ops", "manager"] },
      new: { label: "新品", owner: "品牌项目负责人", scheme: "新品首单-上市备货方案 V1", scope: { pmc: "新品协同查看，不可创建", ops: "无新品完整数据权限", brand: "品牌A新品", buyer: "负责供应商新品", manager: "全部新品" }, canCreate: ["brand", "manager"] }
    };
    const state = { page: "dashboard", scene: "mature", role: "pmc", selectedParam: null, corrections: 0 };

    const paramDict = [
      { name: "采购前置时效", type: "计划参数", value: "35", unit: "天", source: "当前PMC采购备货表/供应商资料待确认", raw: "用户补充：采购前置时效；V1.0含下单时点规则", owner: "采购/PMC待确认", dim: "渠道或供应商/SKU待确认", editable: "按权限可维护", meaning: "从采购需求到可进入供应准备/采购执行所需时效，具体业务含义需采购确认。", purpose: "判断采购是否来得及，并计算最晚下单日和交期风险。", calc: "目标到货日 - 采购前置 - 仓库作业 - 头程/缓冲 = 最晚下单日候选", impact: "35改为40会使最晚下单日提前5天，未确认计划需要重新计算。", basis: "【原型假设】沿用现有业务表参数。", status: "待确认" },
      { name: "仓库作业时效", type: "计划参数", value: "5", unit: "天", source: "仓库作业规则/PMC表待确认", raw: "用户补充：仓库作业时效", owner: "仓库/PMC待确认", dim: "渠道/仓库", editable: "按权限可维护", meaning: "入仓、上架、贴标或仓内处理所需时效。", purpose: "判断到货后多久可售，参与最晚下单日和预计可售日。", calc: "目标可售日 - 仓库作业时效 = 目标到货日", impact: "增加时效会提前采购节点并提高交期风险。", basis: "【原型假设】按现有参数展示。", status: "待确认" },
      { name: "头程时效", type: "计划参数", value: "10-40", unit: "天", source: "物流规则/PMC表待确认", raw: "用户补充：头程时效", owner: "物流/PMC待确认", dim: "渠道/国家/运输方式", editable: "按权限可维护", meaning: "从发运到海外/目标仓入库前的运输时效。", purpose: "影响建议下单时间、预计到货时间和供应风险。", calc: "预计到货日 = 发运日 + 头程时效 + 仓库作业时效", impact: "时效变长会使交期风险提前暴露。", basis: "【当前业务操作实践】亚马逊示例为区间。", status: "待确认" },
      { name: "备货周期", type: "计划参数", value: "14", unit: "天", source: "PMC备货规则/业务表待确认", raw: "用户补充：备货周期（间隔时间）", owner: "PMC", dim: "计划批次/渠道", editable: "按权限可维护", meaning: "当前材料更像两次常规采购计划之间的运行间隔。", purpose: "控制计划运行节奏；是否等于需求覆盖周期不能默认。", calc: "与需求覆盖周期分离展示；是否进入合计备货天数待确认。", impact: "改动可能影响计划生成频率，也可能影响需求覆盖范围。", basis: "【待确认】不默认等于需求覆盖周期。", status: "待确认" },
      { name: "需求覆盖周期", type: "计划参数", value: "待确认", unit: "天", source: "待业务确认", raw: "V0.4新增区分项", owner: "PMC/业务待确认", dim: "计划批次/渠道/SKU", editable: "待确认", meaning: "本次计划需要覆盖的未来需求天数。", purpose: "决定本次要计算多少未来需求。", calc: "需求量 = 日均需求 × 需求覆盖周期", impact: "直接改变最终需求和原始缺口。", basis: "【当前产品判断】必须与备货周期拆开。", status: "待确认" },

          ${step("在途", [["组成", inboundText],["来源", "供应/在途快照；需批次号去重"],["输出", `可抵扣在途 ${r.inbound}`],["纠偏点", "FBA在途能否全部抵扣？次品量是否抵扣？"]])}
          ${step("原始缺口", [["计算", `${r.demand} - ${r.stock} - ${r.inbound} = ${r.gap}`],["输出", r.gap],["性质", "系统计算结果，不可直接配置"]])}
          ${step("MOQ与采购倍数", [["MOQ", r.moq],["采购倍数", r.batch],["计算", `max(MOQ, ceil(${r.gap}/${r.batch})×${r.batch}) = ${r.suggested}`],["输出", `建议采购量 ${r.suggested}`]])}
          ${step("备货日历修正", [["事件", r.calendar],["影响", "影响建议下单日/交期风险，不直接作为数量加项"],["待确认", "春节多备1周是增加覆盖周期还是提前下单？"]])}
          ${step("交期判断", [["最晚下单日", r.latestOrder],["风险", r.risk],["计算依据", "目标到货日 - 生产天数 - 运输/入仓缓冲"]])}
          ${step("人工调整与最终计划", [["人工调整", r.manual],["原因", r.manualReason],["最终采购计划", r.finalQty],["下游", "采购需求/计划结果；PR边界待确认"]])}
        </div>`;
      openDrawer();
    }
    function step(title, rows) {
      return `<div class="chain-step"><div class="chain-title"><span>${title}</span>${tag("可追溯","blue")}</div><div class="chain-body">${rows.map(([k,v])=>`<div class="kv"><div class="kv-k">${k}</div><div class="kv-v">${v}</div></div>`).join("")}</div></div>`;
    }
    function openLineage(key) {
      const [type, sku] = key.split(":");
      const title = type === "forecast" ? "最终需求血缘" : type === "stock" ? "库存血缘" : "在途血缘";
      document.getElementById("drawerTitle").textContent = `${title}：${sku}`;
      const r = Object.values(resultRows).flat().find(x => x.sku === sku);
      let rows = [];
      if (type === "forecast") rows = [["系统预测", `${r.forecast}，来源：数仓销售预测`],["预测版本", "DW-FCST-20260903-V12"],["预测时间", "2026-09-03 08:00"],["人工修正", `${r.adjust}，操作者：${r.owner}，原因：${r.manualReason}`],["最终需求", r.demand]];
      if (type === "stock") rows = r.stockParts.map(x => [x[0], `${x[1]}；${x[2]}；更新时间待接口确认`]);
      if (type === "inbound") rows = r.inboundParts.map(x => [x[0], `${x[1]}；${x[2]}；批次号/单号用于去重`]);
      document.getElementById("drawerBody").innerHTML = `<div class="alert">读取型数据不在计划平台手工维护，必须保留来源、版本、更新时间和原始字段。</div><div style="height:12px"></div>${summary(rows)}`;
      state.selectedParam = title;
      openDrawer();
    }
    function openImpact(name = state.selectedParam || "MOQ") {
      document.getElementById("drawerTitle").textContent = `参数变更影响：${name}`;
      document.getElementById("drawerBody").innerHTML = `<div class="alert">仅做原型演示，不真正执行重算。真实系统应在发布参数前生成影响分析。</div><div style="height:12px"></div>
        ${summary([["参数变更", `${name} 50 -> 100`],["受影响计划", "12个未确认计划"],["受影响SKU", "86个SKU"],["处理建议", "标记参数变化，需重新计算"]])}
        <div style="height:12px"></div><div class="table-wrap"><table><thead><tr><th>计划</th><th>SKU</th><th>原建议采购量</th><th>新建议采购量</th><th>变化量</th><th>状态</th></tr></thead><tbody>
          <tr><td>PLAN-202610-MATURE-001</td><td>AD6025-BK-M</td><td>400</td><td>400</td><td>0</td><td>${tag("需复核")}</td></tr>
          <tr><td>PLAN-202610-MATURE-001</td><td>AD615910100L-B70</td><td>300</td><td>400</td><td>+100</td><td>${tag("变化")}</td></tr>
          <tr><td>PLAN-202610-MULTI-001</td><td>9994115</td><td>200</td><td>200</td><td>0</td><td>${tag("需确认")}</td></tr>
        </tbody></table></div>`;
      openDrawer();
    }
    function openCorrection(origin) {
      document.getElementById("correctionOrigin").value = origin || state.selectedParam || "原型假设待纠偏";
      document.getElementById("modalMask").classList.add("open");
      document.getElementById("correctionModal").classList.add("open");
    }
    function openDrawer() { document.getElementById("drawerMask").classList.add("open"); document.getElementById("drawer").classList.add("open"); }
    function closeDrawer() { document.getElementById("drawerMask").classList.remove("open"); document.getElementById("drawer").classList.remove("open"); }
    function closeModal() { document.getElementById("modalMask").classList.remove("open"); document.getElementById("correctionModal").classList.remove("open"); }

    function renderAll() {
      renderShell();
      renderDashboard();
      renderDemand();
      renderPlan();
      renderResult();
      renderConfigPages();
      bind();
    }
    function bind() {
      document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { state.page = b.dataset.nav; renderAll(); });
      document.querySelectorAll("[data-scene]").forEach(b => b.onclick = () => { state.scene = b.dataset.scene; renderAll(); showToast(`已切换场景：${scene().label}`); });
      document.querySelectorAll("[data-param]").forEach(b => b.onclick = () => openParamDrawer(b.dataset.param));
      document.querySelectorAll("[data-total]").forEach(b => b.onclick = () => openTotalDrawer(b.dataset.total));
      document.querySelectorAll("[data-explain]").forEach(b => b.onclick = () => openExplainDrawer(Number(b.dataset.explain)));
      document.querySelectorAll("[data-lineage]").forEach(b => b.onclick = () => openLineage(b.dataset.lineage));
      document.querySelectorAll("[data-impact]").forEach(b => b.onclick = () => openImpact(b.dataset.impact));
      document.querySelectorAll("[data-correct]").forEach(b => b.onclick = () => openCorrection(`纠偏对象：${b.dataset.correct}\n当前场景：${scene().label}\n当前角色：${roles[state.role]}`));
      const np = document.getElementById("newPlanBtn"); if (np) np.onclick = () => canCreate() ? (state.page="plan", renderAll()) : showToast("当前角色无创建权限");
      const cp = document.getElementById("createPlanBtn"); if (cp) cp.onclick = () => canCreate() ? showToast("已模拟创建计划并冻结输入快照") : showToast("当前角色无创建权限");
    }
    document.getElementById("roleSelect").onchange = e => { state.role = e.target.value; renderAll(); showToast(`已切换角色：${roles[state.role]}`); };
    document.getElementById("drawerClose").onclick = closeDrawer;
    document.getElementById("drawerMask").onclick = closeDrawer;
    document.getElementById("impactFromDrawer").onclick = () => openImpact();
    document.getElementById("correctFromDrawer").onclick = () => openCorrection(`纠偏对象：${state.selectedParam || "当前抽屉内容"}\n请确认参数来源、Owner、计算关系和变更影响。`);
    document.getElementById("modalClose").onclick = closeModal;
    document.getElementById("modalCancel").onclick = closeModal;
    document.getElementById("modalMask").onclick = closeModal;
    document.getElementById("modalSubmit").onclick = () => { state.corrections += 1; closeModal(); renderAll(); showToast(`已模拟记录业务纠偏 ${state.corrections} 条`); };
    renderAll();
  </script>
</body>
</html>
