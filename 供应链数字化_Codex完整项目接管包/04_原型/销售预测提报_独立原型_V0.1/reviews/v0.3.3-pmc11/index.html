      g.listingDays = Math.floor((Date.UTC(2026,8,28) - Date.parse(g.listedAt)) / 86400000);

    const dateLabel = d => `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;

    const num = v => Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 1});
    function clampWindowStart(start, size = state.windowSize) { return Math.max(0, Math.min(allDays.length - size, start)); }
    function syncWindow(start = state.windowStart, end = null) { if (end === null) { state.windowStart = clampWindowStart(start); state.windowEnd = state.windowStart + state.windowSize - 1; } else { state.windowStart = Math.max(0, Math.min(allDays.length - 1, start)); state.windowEnd = Math.max(state.windowStart, Math.min(allDays.length - 1, end)); } state.windowSize = state.windowEnd - state.windowStart + 1; state.offset = state.windowStart; }
    function indexForDate(value) { return allDays.findIndex(d => dateKey(d) === value); }
    function visibleDays() { return allDays.slice(state.windowStart, state.windowEnd + 1); }

    function matches(c, g) { const q = state.query.trim().toLowerCase(); return !q || [g.parent,g.spu,g.name,g.skc,c.asin,c.sku].some(v => String(v).toLowerCase().includes(q)); }
    function manualValue(c, i) { const value = c.manual[i]; return value === null || value === '' || value === undefined ? null : Number(value); }
    function activityAt(c, d) { return c.activity[dateKey(d)] || null; }
    function source(c, d, i) { if (activityAt(c, d)) return ['activity','活动']; if (manualValue(c, i) !== null) return ['manual','人工']; return ['system','系统']; }
    function systemValue(c, i) { return Math.max(0, c.base + (i % 5 === 0 ? 0 : i % 3 === 0 ? 1 : 0)); }
    function activityValue(c, d) { return activityAt(c, d)?.qty || 0; }
    function finalValue(c, d, i) { const activity = activityAt(c, d); const manual = manualValue(c, i); return activity ? activity.qty : manual !== null ? manual : systemValue(c, i); }
    function displayGroups() { return groups.map(g => ({...g, children: g.children.filter(c => matches(c,g))})).filter(g => g.children.length); }
    function weekNumber(d) {
      const utc = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const day = utc.getUTCDay() || 7;
      utc.setUTCDate(utc.getUTCDate() + 4 - day);

      return Math.ceil((((utc - yearStart) / 86400000) + 1) / 7);
    }
    function weekRange(days) { return `${dateLabel(days[0])}-${dateLabel(days[days.length - 1])}`; }

      return weeks;

      return visibleWeeks().flatMap(w=>state.collapsedWeeks.has(w.key)
        ? [{type:'week',key:'week:'+w.key,week:w,days:w.days,boundary:true}]
