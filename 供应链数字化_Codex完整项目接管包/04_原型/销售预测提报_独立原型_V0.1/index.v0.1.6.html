    document.addEventListener('change', e => {
      const t = e.target;
      if (!['rangeStart', 'rangeEnd'].includes(t.id)) return;
      const start = indexForDate($('#rangeStart').value);
      const end = indexForDate($('#rangeEnd').value);
      if (start < 0 || end < 0) return;
      if (t.id === 'rangeStart' && start > end) $('#rangeEnd').value = dateKey(allDays[Math.min(allDays.length - 1, start + state.windowSize - 1)]);
      if (t.id === 'rangeEnd' && end < start) $('#rangeStart').value = dateKey(allDays[Math.max(0, end - state.windowSize + 1)]);
      const nextStart = indexForDate($('#rangeStart').value);
      const nextEnd = indexForDate($('#rangeEnd').value);
      syncWindow(nextStart, nextEnd);
      render();
      e.stopImmediatePropagation();
    }, true);
    document.addEventListener('change', e => { if(e.target.id === 'selectAll') { displayGroups().flatMap(g=>g.children).forEach(c=>e.target.checked?state.selected.add(c.asin):state.selected.delete(c.asin)); renderTable(); } });
    function commitManual(input) {
      const child=findChild(input.dataset.manual), index=Number(input.dataset.index), raw=input.value.trim();
      const value=raw === '' ? null : Number(raw);
      if(value !== null && (!Number.isFinite(value) || value<0 || !Number.isInteger(value))) {
        input.value=child.manual[index] ?? ''; toast('请输入大于等于 0 的整数'); return false;
      }
      child.manual[index]=value; state.editing=null; renderTable();
      document.querySelector(`[data-edit-manual="${child.asin}"][data-index="${index}"]`)?.closest('td').classList.add('just-saved');
      return true;
    }
    document.addEventListener('focusout',e=>{
      if(e.target.matches('[data-manual]') && state.editing) commitManual(e.target);
    });
    document.addEventListener('click',async e=>{
      const copy=e.target.closest('[data-copy]');
      if(copy) { try { await navigator.clipboard.writeText(copy.dataset.copy); toast('已复制'); } catch { toast('复制失败，请重试'); } return; }
      const thumb=e.target.closest('[data-preview]'); if(thumb) showImagePreview(thumb);
    });
    function showImagePreview(thumb) {
      const preview=$('#imagePreview'), img=$('img',preview), rect=thumb.getBoundingClientRect();
      img.src=thumb.dataset.preview; img.alt=$('img',thumb).alt;
      preview.hidden=false;
      const width=preview.offsetWidth, height=preview.offsetHeight;
      const left=Math.min(rect.right+14, innerWidth-width-12);
      const top=Math.max(12, Math.min(rect.top-12, innerHeight-height-12));
      preview.style.left=left+'px'; preview.style.top=top+'px';
      preview.style.setProperty('--arrow-y',Math.max(16,Math.min(height-26,rect.top+rect.height/2-top-5))+'px');
    }
    function hideImagePreview() { $('#imagePreview').hidden=true; }
    document.addEventListener('pointerover',e=>{ const thumb=e.target.closest('[data-preview]'); if(thumb)showImagePreview(thumb); });
    document.addEventListener('pointerout',e=>{ const thumb=e.target.closest('[data-preview]'); if(thumb && !thumb.contains(e.relatedTarget))hideImagePreview(); });
    document.addEventListener('focusin',e=>{ const thumb=e.target.closest('[data-preview]'); if(thumb)showImagePreview(thumb); });
    document.addEventListener('focusout',e=>{ if(e.target.closest('[data-preview]'))hideImagePreview(); });
    $('#workbench').addEventListener('scroll',hideImagePreview);
    window.addEventListener('resize',()=>{ hideImagePreview(); syncHorizontalScrollbar(); });
    new ResizeObserver(syncHorizontalScrollbar).observe($('#workbench'));
    function clearCross() { $$('.focus-cross-column, .focus-cross-row, .focus-cross-cell', $('#workbench')).forEach(el=>el.classList.remove('focus-cross-column','focus-cross-row','focus-cross-cell')); }
    function highlightCell(cell) {
      clearCross(); if(!cell || resizeSession)return;
      const table=cell.closest('.forecast-table');
      $$(`[data-focus-index="${cell.dataset.focusIndex}"]`,table).forEach(el=>el.classList.add('focus-cross-column'));
      cell.closest('tr').classList.add('focus-cross-row'); cell.classList.add('focus-cross-cell');
    }
    document.addEventListener('pointerover', e => { const cell=e.target.closest('td[data-focus-index]'); if(cell)highlightCell(cell); });
    document.addEventListener('pointerout',e=>{
      const cell=e.target.closest('td[data-focus-index]');
      if(!cell || (e.relatedTarget && cell.contains(e.relatedTarget)))return;
      cell.classList.remove('just-saved'); clearCross();
    });
    document.addEventListener('keydown',e=>{
      const handle=e.target.closest('[data-resize-column]');
      if(handle && ['ArrowLeft','ArrowRight'].includes(e.key)) { e.preventDefault(); setColumnWidth(handle.dataset.resizeColumn,columnWidth(handle.dataset.resizeColumn)+(e.key==='ArrowRight'?8:-8)); }
      if(e.key==='Escape') {
        hideImagePreview(); clearCross(); closeOverlays();
        if(e.target.matches('[data-manual]')) { state.editing=null; renderTable(); }
      }
      if(e.key==='Enter' && e.target.matches('[data-manual]')) { e.preventDefault(); e.target.blur(); }
    });
    render();
  </script>
</body>
</html>
